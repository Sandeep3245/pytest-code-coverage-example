trigger:
- main
- master

# Keep running on your active local self-hosted worker pool
pool:
  name: 'Default'  

steps:
- checkout: self 
  displayName: 'Fetch Application Code & Tests'

# 1. Install Dependencies on your local laptop worker
- powershell: |
    Write-Host "Installing application dependencies and pytest packages..."
    python -m pip install --upgrade pip
    pip install pytest pytest-cov
  displayName: 'Install Frameworks'

# 2. Execute Tests and Generate BOTH XML and HTML Reports
- powershell: |
    Write-Host "Running test suite with dual coverage tracking..."
    # xml output is for SonarCloud tracking; html output is for your artifact browser
    pytest --cov=src --cov-report=xml:coverage.xml --cov-report=html:htmlcov
  displayName: 'Execute Pytest & Generate Coverage Reports'

# 3. Initialize SonarCloud Scan (Upgraded to @4)
- task: SonarCloudPrepare@4
  displayName: 'Prepare SonarCloud Analysis'
  inputs:
    SonarCloud: 'SonarCloud-Service-Connection'
    organization: 'sandeepsandiss73'
    scannerMode: 'CLI'
    configMode: 'manual'
    cliProjectKey: 'sandeepsandiss73_pytest-coverage-example'
    cliProjectName: 'Pytest_Coverage_Example'
    cliSources: 'src'
    extraProperties: |
      sonar.language=py
      sonar.python.version=3
      # Feed the generated XML test data directly into the SonarCloud platform
      sonar.python.coverage.reportPaths=coverage.xml

# 4. Run the deep analysis scan
- task: SonarCloudAnalyze@4
  displayName: 'Execute SonarCloud Code Scan'

# 5. Sync results to Azure Portal dashboard
- task: SonarCloudPublish@4
  displayName: 'Publish Quality Gate Results'
  inputs:
    pollingTimeoutSec: '300'

# 6. Upload the full interactive HTML folder directly to your Pipeline Artifacts
- task: PublishPipelineArtifact@1
  displayName: 'Publish Interactive HTML Coverage Dashboard'
  inputs:
    targetPath: '$(System.DefaultWorkingDirectory)/htmlcov'
    artifactName: 'Python-Unit-Test-Coverage'
    publishLocation: 'pipeline'