trigger:
- main
- master

pool:
  vmImage: 'windows-latest'

steps:
- checkout: self 
  displayName: 'Fetch Application Code & Tests'

# 1. Provision a clean Python 3.x runtime environment
- task: UsePythonVersion@0
  displayName: 'Set up Python 3.x Environment'
  inputs:
    versionSpec: '3.x'
    addToPath: true

# 2. Initialize the SonarCloud Quality Engine configuration
- task: SonarCloudPrepare@4
  displayName: 'Prepare SonarCloud Analysis'
  inputs:
    SonarCloud: 'SonarCloud-Service-Connection'
    organization: 'sandeepsandiss73'
    scannerMode: 'CLI'
    configMode: 'manual'
    cliProjectKey: 'sandeepsandiss73_pytest-coverage-example'
    cliProjectName: 'Pytest_Coverage_Example'
    cliSources: 'bank_app'
    extraProperties: |
      sonar.language=py
      sonar.python.version=3
      sonar.sources=bank_app
      sonar.tests=tests
      sonar.python.coverage.reportPaths=$(System.DefaultWorkingDirectory)/coverage.xml

# 3. Install required test execution dependencies
- powershell: |
    python -m pip install --upgrade pip
    pip install pytest pytest-cov
  displayName: 'Install Test Dependencies'

# 4. Run the unit test suite and break the pipeline if coverage is under 98%
- powershell: |
    pytest --cov=bank_app tests/ --cov-report=xml:coverage.xml --cov-report=html:htmlcov --cov-fail-under=98
  displayName: 'Execute Pytest & Enforce 98% Coverage'

# 5. Scan the lines (CHANGED: runs even if step 4 fails)
- task: SonarCloudAnalyze@4
  displayName: 'Execute SonarCloud Code Scan'
  condition: always() 

# 6. Publish Quality Gate metrics back to dashboard (CHANGED: runs even if step 4 fails)
- task: SonarCloudPublish@4
  displayName: 'Publish Quality Gate Results'
  condition: always()
  inputs:
    pollingTimeoutSec: '300'

# 7. Upload the interactive HTML report to your Artifacts vault
- task: PublishPipelineArtifact@1
  displayName: 'Publish Interactive HTML Coverage Dashboard'
  condition: always() 
  inputs:
    targetPath: '$(System.DefaultWorkingDirectory)/htmlcov'
    artifactName: 'Python-Unit-Test-Coverage'
    publishLocation: 'pipeline'